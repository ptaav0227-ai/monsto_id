<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モンストID検索</title>
<style>
  :root{
    --bg:#101215; --panel:#1a1d22; --panel2:#20242a; --line:#2b2f36;
    --text:#f0f1f3; --muted:#8a8f98; --accent:#ff7d1f;
    --ok:#4fd587; --warn:#e0a83f; --bad:#e2574c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f5f7; --panel:#ffffff; --panel2:#f0f1f3; --line:#e3e5e9;
      --text:#1c1e22; --muted:#6b7078; --accent:#ff7d1f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101215; --panel:#1a1d22; --panel2:#20242a; --line:#2b2f36;
    --text:#f0f1f3; --muted:#8a8f98; --accent:#ff7d1f;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 18px 60px;
  }
  .wrap{width:100%; max-width:460px;}
  h1{
    font-size:1.05rem; font-weight:700; letter-spacing:.02em;
    margin:0 0 4px; color:var(--text);
  }
  .sub{color:var(--muted); font-size:0.82rem; margin-bottom:28px;}
  .search-box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:6px; display:flex; align-items:center; gap:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .search-box svg{flex-shrink:0; color:var(--muted); margin-left:10px;}
  #idInput{
    flex:1; border:none; background:transparent; color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:1.1rem;
    padding:14px 6px; outline:none; letter-spacing:.02em;
    min-width:0;
  }
  #idInput::placeholder{color:var(--muted); font-family:inherit;}
  .clear-btn{
    background:var(--panel2); border:none; color:var(--muted);
    width:32px; height:32px; border-radius:50%; font-size:1rem;
    cursor:pointer; flex-shrink:0; margin-right:6px; display:none;
  }
  .clear-btn.show{display:block;}

  .result{margin-top:22px; min-height:1px;}
  .placeholder{
    color:var(--muted); font-size:0.85rem; text-align:center;
    padding:40px 20px; line-height:1.8;
  }
  .placeholder .big{font-size:2.2rem; display:block; margin-bottom:10px;}

  .result-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px;
    margin-bottom:14px;
  }
  .status-pill::before{content:"";width:6px;height:6px;border-radius:50%;}
  .status-active{background:rgba(79,213,135,.14); color:var(--ok);}
  .status-active::before{background:var(--ok);}
  .status-closed{background:rgba(224,168,63,.14); color:var(--warn);}
  .status-closed::before{background:var(--warn);}
  .status-withdrawn{background:rgba(226,87,76,.14); color:var(--bad);}
  .status-withdrawn::before{background:var(--bad);}

  .line-name{font-size:0.78rem; color:var(--muted); margin-bottom:2px;}
  .acct-name{font-size:1.3rem; font-weight:700; color:var(--text); margin-bottom:16px; word-break:break-word;}
  .detail-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-top:1px solid var(--line);
    font-size:0.9rem;
  }
  .detail-row:first-of-type{border-top:none;}
  .detail-label{color:var(--muted);}
  .detail-value{font-family:'JetBrains Mono',monospace; color:var(--text);}

  .not-found{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:32px 20px; text-align:center; color:var(--muted); font-size:0.9rem;
  }
  .not-found .big{font-size:2rem; display:block; margin-bottom:10px;}

  .tabs{
    display:flex; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:14px; padding:4px; margin-bottom:16px;
  }
  .tab-btn{
    flex:1; border:none; background:transparent; color:var(--muted);
    font-family:inherit; font-size:0.85rem; font-weight:700;
    padding:10px 0; border-radius:10px; cursor:pointer;
  }
  .tab-btn.active{background:var(--panel); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.2);}

  .rank-hint{color:var(--muted); font-size:0.78rem; margin:10px 2px 0;}

  .rank-list{display:flex; flex-direction:column; gap:10px;}
  .rank-item{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:12px;
  }
  .rank-item .r-badge{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1rem;
    color:var(--accent); background:rgba(255,125,31,.12);
    border-radius:10px; padding:6px 10px; flex-shrink:0; min-width:56px; text-align:center;
  }
  .rank-item .r-body{flex:1; min-width:0;}
  .rank-item .r-line{font-size:0.72rem; color:var(--muted); margin-bottom:1px;}
  .rank-item .r-acct{font-size:0.95rem; color:var(--text); font-weight:600; word-break:break-word;}
  .rank-item .r-id{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--muted); margin-top:2px;}
  .rank-item .r-status{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; flex-shrink:0;}

  .rank-count{color:var(--muted); font-size:0.8rem; margin-bottom:10px;}

  footer{margin-top:40px; color:var(--muted); font-size:0.72rem; text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <h1 id="pageTitle">モンストID検索</h1>
  <div class="sub" id="pageSub">絆グループのIDを入力すると、誰の垢か調べられます</div>

  <div class="tabs">
    <button class="tab-btn active" id="tabId">IDで検索</button>
    <button class="tab-btn" id="tabRank">ランクで検索</button>
  </div>

  <div class="search-box" id="idSearchBox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="idInput" type="text" inputmode="numeric" placeholder="モンストIDを入力" autocomplete="off">
    <button class="clear-btn" id="clearBtn" aria-label="クリア">✕</button>
  </div>

  <div class="search-box" id="rankSearchBox" style="display:none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="rankInput" type="text" inputmode="numeric" placeholder="ランクを入力(例:1500)" autocomplete="off">
    <button class="clear-btn" id="rankClearBtn" aria-label="クリア">✕</button>
  </div>
  <div class="rank-hint" id="rankHint" style="display:none;"></div>

  <div class="result" id="result">
    <div class="placeholder">
      <span class="big">🔍</span>
      IDを入力すると<br>結果がここに表示されます
    </div>
  </div>

  <footer>絆グループ名簿と連動(手動更新)<br>更新日:2026-10-01</footer>
</div>

const idInput = document.getElementById('idInput');
const clearBtn = document.getElementById('clearBtn');
const result = document.getElementById('result');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPlaceholder(){
  result.innerHTML = '<div class="placeholder"><span class="big">🔍</span>IDを入力すると<br>結果がここに表示されます</div>';
}

function renderNotFound(){
  result.innerHTML = '<div class="not-found"><span class="big">🤷</span>該当するIDが見つかりませんでした</div>';
}

function renderHit(lineName, account, status){
  const pillClass = status === '退会済み' ? 'status-withdrawn' : (status === '募集停止中' ? 'status-closed' : 'status-active');
  result.innerHTML = `
    <div class="result-card">
      <div class="status-pill ${pillClass}">${escapeHtml(status)}</div>
      <div class="line-name">${escapeHtml(lineName)}</div>
      <div class="acct-name">${escapeHtml(account.accountName)}</div>
      <div class="detail-row"><span class="detail-label">ランク</span><span class="detail-value">${escapeHtml(account.rank)}</span></div>
      <div class="detail-row"><span class="detail-label">モンストID</span><span class="detail-value">${escapeHtml(account.gameId)}</span></div>
    </div>
  `;
}

function search(raw){
  if (!raw){ renderPlaceholder(); clearBtn.classList.remove('show'); return; }
  clearBtn.classList.add('show');
  for (const m of MEMBERS){
    for (const a of m.accounts){
      if (a.gameId === raw){ renderHit(m.lineName, a, a.closed ? '募集停止中' : '在籍中'); return; }
    }
  }
  for (const m of WITHDRAWN){
    for (const a of m.accounts){
      if (a.gameId === raw){ renderHit(m.lineName, a, '退会済み'); return; }
    }
  }
  renderNotFound();
}

idInput.addEventListener('input', () => {
  const raw = idInput.value.replace(/[,\s、]/g, '').trim();
  search(raw);
});
clearBtn.addEventListener('click', () => {
  idInput.value = '';
  renderPlaceholder();
  clearBtn.classList.remove('show');
  idInput.focus();
});

// ==== ランクで検索(入力ランク〜+100の範囲) ====
const rankInput = document.getElementById('rankInput');
const rankClearBtn = document.getElementById('rankClearBtn');
const rankHint = document.getElementById('rankHint');
const tabId = document.getElementById('tabId');
const tabRank = document.getElementById('tabRank');
const idSearchBox = document.getElementById('idSearchBox');
const rankSearchBox = document.getElementById('rankSearchBox');
const pageSub = document.getElementById('pageSub');

function allAccountsFlat(){
  const list = [];
  MEMBERS.forEach(m => m.accounts.forEach(a => {
    list.push({ lineName: m.lineName, account: a, status: a.closed ? '募集停止中' : '在籍中' });
  }));
  WITHDRAWN.forEach(m => m.accounts.forEach(a => {
    list.push({ lineName: m.lineName, account: a, status: '退会済み' });
  }));
  return list;
}

function statusClass(status){
  return status === '退会済み' ? 'status-withdrawn' : (status === '募集停止中' ? 'status-closed' : 'status-active');
}

function renderRankPlaceholder(){
  result.innerHTML = '<div class="placeholder"><span class="big">📶</span>ランクを入力すると<br>その範囲の垢が一覧表示されます</div>';
  rankHint.style.display = 'none';
}

function renderRankResults(lower, upper, hits){
  rankHint.style.display = 'block';
  rankHint.textContent = `ランク ${lower}〜${upper} の範囲`;
  if (hits.length === 0){
    result.innerHTML = '<div class="not-found"><span class="big">🤷</span>この範囲に該当する垢が見つかりませんでした</div>';
    return;
  }
  hits.sort((a,b) => parseInt(b.account.rank,10) - parseInt(a.account.rank,10));
  const rows = hits.map(h => `
    <div class="rank-item">
      <div class="r-badge">${escapeHtml(h.account.rank)}</div>
      <div class="r-body">
        <div class="r-line">${escapeHtml(h.lineName)}</div>
        <div class="r-acct">${escapeHtml(h.account.accountName)}</div>
        <div class="r-id">ID:${escapeHtml(h.account.gameId)}</div>
      </div>
      <div class="r-status ${statusClass(h.status)}">${escapeHtml(h.status)}</div>
    </div>
  `).join('');
  result.innerHTML = `<div class="rank-count">${hits.length}件ヒット</div><div class="rank-list">${rows}</div>`;
}

function rankSearch(raw){
  if (!raw){ renderRankPlaceholder(); rankClearBtn.classList.remove('show'); return; }
  const n = parseInt(raw, 10);
  if (isNaN(n)){ renderRankPlaceholder(); return; }
  rankClearBtn.classList.add('show');
  const lower = n, upper = n + 100;
  const hits = allAccountsFlat().filter(h => {
    const r = parseInt(h.account.rank, 10);
    return !isNaN(r) && r >= lower && r <= upper;
  });
  renderRankResults(lower, upper, hits);
}

rankInput.addEventListener('input', () => {
  const raw = rankInput.value.replace(/[,\s、]/g, '').trim();
  rankSearch(raw);
});
rankClearBtn.addEventListener('click', () => {
  rankInput.value = '';
  renderRankPlaceholder();
  rankClearBtn.classList.remove('show');
  rankInput.focus();
});

function switchTab(mode){
  if (mode === 'id'){
    tabId.classList.add('active'); tabRank.classList.remove('active');
    idSearchBox.style.display = 'flex'; rankSearchBox.style.display = 'none';
    pageSub.textContent = '絆グループのIDを入力すると、誰の垢か調べられます';
    search(idInput.value.replace(/[,\s、]/g, '').trim());
  } else {
    tabRank.classList.add('active'); tabId.classList.remove('active');
    idSearchBox.style.display = 'none'; rankSearchBox.style.display = 'flex';
    pageSub.textContent = 'ランクを入力すると、そこから+100までの垢を一覧表示します';
    rankSearch(rankInput.value.replace(/[,\s、]/g, '').trim());
  }
}
tabId.addEventListener('click', () => switchTab('id'));
tabRank.addEventListener('click', () => switchTab('rank'));
</script>
