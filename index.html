<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絆グループ アカウント検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#090c11;
    --bg-1:#0e131b;
    --panel:#131a25;
    --panel-2:#182131;
    --line:#232e40;
    --line-soft:#1a2333;
    --orange:#ff7d1f;
    --orange-2:#ff5a2e;
    --orange-dark:#c9370f;
    --gold:#ffd54a;
    --blue:#3fa9ff;
    --blue-dark:#155fa8;
    --green:#6fd15c;
    --text:#f3f6f9;
    --muted:#8fa0b8;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 700px 420px at 100% -6%, rgba(255,125,31,.14), transparent 55%),
      radial-gradient(ellipse 620px 500px at -10% 30%, rgba(63,169,255,.08), transparent 55%),
      var(--bg-0);
    color:var(--text);
    font-family:'Zen Maru Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 14px;}

  /* ---- HUD top bar (Monster Strike-style) ---- */
  .hud{
    position:relative;overflow:hidden;
    background:linear-gradient(120deg,var(--orange),var(--orange-2) 55%,var(--orange-dark));
    padding:18px 18px 22px;
    border-bottom:3px solid rgba(0,0,0,.25);
    box-shadow:0 10px 24px -10px rgba(0,0,0,.6);
  }
  .hud::before{
    content:"";position:absolute;inset:0;opacity:.14;pointer-events:none;
    background-image:
      linear-gradient(60deg, transparent 48%, rgba(255,255,255,.5) 49%, rgba(255,255,255,.5) 51%, transparent 52%),
      linear-gradient(-60deg, transparent 48%, rgba(255,255,255,.5) 49%, rgba(255,255,255,.5) 51%, transparent 52%);
    background-size:46px 80px;
  }
  .hud-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:1;}
  .hud-badge{
    display:flex;align-items:center;gap:8px;
    background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25);
    border-radius:30px;padding:6px 12px 6px 8px;
  }
  .flame{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #fff6d8, var(--gold) 30%, var(--orange-2) 65%, var(--orange-dark) 100%);
    box-shadow:0 0 10px rgba(255,180,60,.7);
  }
  .hud-badge span{font-size:12px;font-weight:700;color:#fff;letter-spacing:.02em;}
  .member-count{
    display:flex;align-items:center;gap:6px;
    background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25);
    border-radius:30px;padding:6px 12px;font-size:12px;font-weight:700;color:#fff;
  }
  .member-count .clover{width:14px;height:14px;}

  h1{
    position:relative;z-index:1;
    font-family:'Shippori Mincho',serif;font-weight:800;
    font-size:27px;margin:14px 0 3px;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 0 rgba(0,0,0,.25), 0 0 18px rgba(255,220,150,.35);
  }
  .sub{position:relative;z-index:1;color:rgba(255,255,255,.85);font-size:12.5px;margin:0;line-height:1.5;}

  /* ---- Search ---- */
  .search-card{
    position:relative;margin-top:-14px;z-index:2;
    background:linear-gradient(165deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:0 14px 28px -16px rgba(0,0,0,.7);
  }
  .search-row{display:flex;gap:8px;align-items:center;}
  .search-icon{color:var(--muted);flex-shrink:0;}
  .search-row input{
    flex:1;background:var(--bg-1);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;color:var(--text);
    font-family:'Zen Maru Gothic',sans-serif;font-size:15px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-row input::placeholder{color:var(--muted-2, #576375);}
  .search-row input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,125,31,.18);}
  .hint{margin-top:9px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  /* ---- Ranks overview table ---- */
  .section-label{
    font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;
    letter-spacing:.1em;text-transform:uppercase;margin:20px 2px 9px;
    display:flex;align-items:center;gap:6px;
  }
  .section-label::before{content:"";width:4px;height:12px;background:var(--orange);border-radius:2px;}

  .table-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  .withdrawn-item{
    padding:12px 14px;border-bottom:1px solid var(--line-soft);
  }
  .withdrawn-item:last-child{border-bottom:none;}
  .withdrawn-name{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;
  }
  .withdrawn-name::before{content:"退会";
    font-size:10px;font-weight:700;color:#e2574c;
    background:rgba(226,87,76,.12);border-radius:999px;padding:2px 8px;
  }
  .withdrawn-acct{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    font-size:12px;color:var(--muted);padding:4px 0 4px 4px;
    font-family:'JetBrains Mono',monospace;
  }
  .withdrawn-acct-name{color:var(--text);font-family:inherit;min-width:110px;}
  .withdrawn-acct-rank{color:var(--accent,#ff7d1f);}
  .withdrawn-acct-id{color:var(--muted);}
  .withdrawn-empty{padding:14px;font-size:12px;color:var(--muted);text-align:center;}
  table.ranks{width:100%;border-collapse:collapse;}
  table.ranks th{
    text-align:left;font-size:10px;color:var(--muted);font-weight:700;
    padding:10px 14px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;
    text-transform:uppercase;border-bottom:1px solid var(--line-soft);
    background:rgba(255,125,31,.06);
  }
  table.ranks th.num{text-align:right;}
  table.ranks td{
    padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line-soft);
    vertical-align:middle;
  }
  table.ranks tr:last-child td{border-bottom:none;}
  table.ranks tr:hover td{background:rgba(255,125,31,.04);}
  table.ranks td.name{font-weight:700;white-space:nowrap;}
  table.ranks td.ranks-list{text-align:right;}
  table.ranks td.ranks-list .r{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:38px;background:linear-gradient(180deg,var(--blue),var(--blue-dark));
    color:#fff;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;padding:2px 9px;margin-left:5px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;
  }
  table.ranks td.ranks-list .r.closed-r{
    background:linear-gradient(180deg,#5a6472,#333c48);opacity:.7;
    text-decoration:line-through;
  }
  .table-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px;}

  /* ---- Results (detail cards) ---- */
  .results{display:flex;flex-direction:column;gap:12px;}
  .person{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;animation:fadeIn .3s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .person-head{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg, rgba(255,125,31,.10), transparent 70%);
  }
  .avatar{
    overflow:hidden;
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:800;color:#1a0e05;font-size:14px;
    background:radial-gradient(circle at 32% 28%, #ffe9b0, var(--gold) 35%, var(--orange) 75%, var(--orange-dark) 100%);
    border:2px solid rgba(255,255,255,.35);
  }
  .person-name-wrap{flex:1;cursor:pointer;min-width:0;}
  .person-name{font-weight:700;font-size:15px;}
  .person-name .tap-hint{margin-top:1px;}
  .person-badges{display:flex;flex-direction:column;align-items:flex-end;gap:6px;cursor:pointer;flex-shrink:0;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;}
  .acct-count{
    font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;
    background:var(--bg-1);border:1px solid var(--line);border-radius:20px;padding:3px 9px;
  }
  .time-badge{
    font-size:10.5px;color:#8be89a;font-weight:700;
    background:rgba(139,232,154,.1);border:1px solid rgba(139,232,154,.4);
    border-radius:20px;padding:3px 9px;display:flex;align-items:center;gap:3px;
  }

  .filter-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:0;margin:12px 0;overflow:hidden;
  }
  .filter-header{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    color:var(--text);font-weight:700;font-size:13.5px;
    font-family:'Zen Maru Gothic',sans-serif;padding:14px 16px;
  }
  .switch{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch-track{
    position:absolute;inset:0;background:var(--bg-1);border:1px solid var(--line);
    border-radius:20px;transition:background .2s,border-color .2s;cursor:pointer;
  }
  .switch-thumb{
    position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
    background:var(--muted);transition:transform .2s,background .2s;
  }
  .switch input:checked + .switch-track{background:linear-gradient(120deg,var(--orange),var(--orange-2));border-color:var(--orange);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(18px);background:#fff;}
  .filter-body-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;}
  .filter-body-wrap.open{grid-template-rows:1fr;}
  .filter-body-inner{overflow:hidden;}
  .filter-body-inner > *{padding-left:16px;padding-right:16px;}
  .filter-body-inner > .filter-group:first-child{padding-top:2px;}
  .filter-body-inner > .filter-reset{padding-bottom:14px;padding-top:6px;}
  .filter-group{margin-bottom:8px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .filter-radio{display:flex;gap:6px;}
  .filter-radio.wrap4{flex-wrap:wrap;}
  .filter-radio.wrap4 .radio-btn{flex:1 1 calc(50% - 3px);}
  .radio-btn{
    flex:1;border:1px solid var(--line);background:var(--bg-1);color:var(--muted);
    font-size:12px;font-weight:700;padding:7px 8px;border-radius:10px;cursor:pointer;
    font-family:'Zen Maru Gothic',sans-serif;transition:background .15s,color .15s,border-color .15s;
    line-height:1.2;
  }
  .radio-btn.active{background:linear-gradient(120deg,var(--orange),var(--orange-2));color:#1a0e05;border-color:var(--orange);}
  .filter-reset{
    font-size:11px;color:var(--muted);background:none;border:none;
    text-decoration:underline;cursor:pointer;margin-top:6px;padding:0;
  }
  .accounts-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;}
  .person.accounts-open .accounts-wrap{grid-template-rows:1fr;}
  .accounts-inner{overflow:hidden;}
  .accounts{display:flex;flex-direction:column;}
  .acct{padding:12px 14px;border-top:1px dashed var(--line-soft);cursor:pointer;transition:background .15s;}
  .acct:first-child{border-top:none;}
  .acct:hover{background:rgba(255,125,31,.04);}
  .acct.closed{cursor:default;background:rgba(255,255,255,.015);}
  .acct.closed:hover{background:rgba(255,255,255,.015);}
  .acct.closed .acct-name{color:var(--muted);}
  .acct.closed .rank-badge{
    background:linear-gradient(180deg,#5a6472,#333c48);
    box-shadow:0 0 0 3px rgba(255,255,255,.05), 0 4px 10px rgba(0,0,0,.4);
  }
  .closed-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(226,87,76,.14);border:1px solid rgba(226,87,76,.5);
    color:#ff8478;font-size:10.5px;font-weight:700;
    padding:2px 8px;border-radius:20px;margin-top:4px;
  }
  .closed-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:#e2574c;}
  .status-badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
    margin-top:4px;letter-spacing:.02em;
  }
  .status-badge::before{content:"";width:6px;height:6px;border-radius:50%;}
  .status-badge.updated{background:rgba(46,158,91,.15);color:#4fd587;}
  .status-badge.updated::before{background:#4fd587;}
  .status-badge.unknown{background:rgba(201,138,31,.15);color:#e0a83f;}
  .status-badge.unknown::before{background:#e0a83f;}
  .status-badge.unsure{background:rgba(138,143,152,.18);color:#aab0ba;}
  .status-badge.unsure::before{background:#aab0ba;}
  .acct-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .acct-name{font-weight:600;font-size:14px;}
  .tap-hint{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .rank-badge{
    flex-shrink:0;width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #bfe3ff, var(--blue) 45%, var(--blue-dark) 100%);
    border:2px solid rgba(255,255,255,.4);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px rgba(63,169,255,.15), 0 4px 10px rgba(0,0,0,.4);
  }
  .rank-badge .rlabel{font-size:7px;font-weight:700;color:#eaf6ff;letter-spacing:.05em;line-height:1;}
  .rank-badge .rnum{font-size:13px;font-weight:800;color:#fff;line-height:1.2;font-family:'JetBrains Mono',monospace;}

  .acct-id-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;}
  .acct.open .acct-id-wrap{grid-template-rows:1fr;}
  .acct-id-inner{overflow:hidden;}

  .memo-btn{
    flex-shrink:0;display:flex;align-items:center;gap:4px;
    background:var(--bg-1);border:1px solid var(--line);border-radius:20px;
    padding:5px 10px;font-size:11px;font-weight:700;color:var(--muted);
    font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:background .15s,color .15s;
  }
  .memo-btn:hover{background:rgba(255,125,31,.1);color:var(--text);}
  .memo-btn.has-note{color:var(--gold);border-color:rgba(255,213,74,.4);}
  .person.memo-open .memo-btn{background:rgba(255,125,31,.16);color:var(--text);}
  .memo-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;}
  .person.memo-open .memo-wrap{grid-template-rows:1fr;}
  .memo-inner{overflow:hidden;}
  .memo-body{
    padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--text);
    background:rgba(255,213,74,.06);border-bottom:1px solid var(--line);
    white-space:pre-wrap;
  }
  .memo-body.empty{color:var(--muted);}
  .acct-id-row{
    display:flex;align-items:center;gap:8px;margin-top:10px;
    background:var(--bg-1);border:1px solid var(--line);border-radius:9px;padding:9px 10px;
  }
  .acct-id{
    font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--gold);
    letter-spacing:.03em;flex:1;overflow-x:auto;white-space:nowrap;
  }
  .copy-btn{
    flex-shrink:0;border:1px solid var(--orange);background:rgba(255,125,31,.14);
    color:var(--orange);font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:7px;
    cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;transition:background .15s,transform .1s;
  }
  .copy-btn:hover{background:rgba(255,125,31,.26);}
  .copy-btn:active{transform:scale(.95);}
  .copy-btn.copied{background:var(--orange);color:#1a0e05;border-color:var(--orange);}

  .empty, .loading{text-align:center;color:var(--muted);font-size:13px;padding:44px 10px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--panel-2);border:1px solid var(--orange);color:var(--gold);
    padding:11px 20px;border-radius:30px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;
    font-family:'Zen Maru Gothic',sans-serif;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footer-note{
    text-align:center;color:var(--muted);font-size:10.5px;margin-top:26px;line-height:1.7;
  }

  html{color-scheme:dark;}
  input,textarea,button,select{
    color:inherit;
    -webkit-text-fill-color:currentColor;
  }

</style>
<style>
  .update-banner{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(135deg,#2b3a1f,#1f2e17);
    border:1px solid #6fbf3a;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
    box-shadow:0 0 0 1px rgba(111,191,58,.15) inset;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .update-icon{ font-size:20px; flex:none; }
  .update-text{ color:#d9f5c4; font-size:13.5px; line-height:1.4; }
  .update-text strong{ color:#9be86a; }
  #updateNames{ color:#fff; font-weight:700; }
</style>
</head>
<body>
  <div class="hud">
    <div class="wrap" style="padding:0;">
      <div class="hud-row">
        <div class="hud-badge"><span class="flame"></span><span>MONSTER STRIKE</span></div>
        <div class="member-count">
          <svg class="clover" viewBox="0 0 24 24" fill="#8be86a"><path d="M12 2a3 3 0 0 0-3 3 3 3 0 0 0 .3 1.3A3 3 0 0 0 5 9a3 3 0 0 0 3 3h.3A3 3 0 0 0 5 15a3 3 0 0 0 3 3 3 3 0 0 0 1.3-.3A3 3 0 0 0 12 21a3 3 0 0 0 2.7-3.3A3 3 0 0 0 16 18a3 3 0 0 0 3-3 3 3 0 0 0-3.3-3H16a3 3 0 0 0 3-3 3 3 0 0 0-3-3 3 3 0 0 0-1.3.3A3 3 0 0 0 12 2z"/></svg>
          <span id="hudCount">0人登録</span>
        </div>
      </div>
      <h1>絆グループ アカウント検索</h1>
      <p class="sub">LINE名で検索 → 垢の名前とランクが表示 → タップしてIDをコピー</p>
    </div>
  </div>

  <div class="wrap">
    <div class="update-banner" id="updateBanner">
      <span class="update-icon">🔔</span>
      <span class="update-text" id="updateText"></span>
    </div>

    <div class="search-card">
      <div class="search-row">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="LINE名を入力(部分一致でOK)" autocomplete="off">
      </div>
      <div class="hint" id="resultHint"></div>
    </div>

    <div class="filter-card">
      <div class="filter-header">
        <span>あなたの情報</span>
        <label class="switch">
          <input type="checkbox" id="filterMasterSwitch">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
      <div class="filter-body-wrap" id="filterBodyWrap"><div class="filter-body-inner">
      <div class="filter-group">
        <div class="filter-label">プレイする神殿クエスト</div>
        <div class="filter-radio" data-filter-group="temple">
          <button class="radio-btn" data-value="闇時2">闇時2</button>
          <button class="radio-btn" data-value="その他">その他</button>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-label">あなたのアカウント数</div>
        <div class="filter-radio" data-filter-group="acct">
          <button class="radio-btn" data-value="1垢">1垢</button>
          <button class="radio-btn" data-value="複数垢">複数垢</button>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-label">あなたの番号</div>
        <div class="filter-radio" data-filter-group="number">
          <button class="radio-btn" data-value="番号無し">番号無し</button>
          <button class="radio-btn" data-value="777">777</button>
        </div>
      </div>
      <div class="filter-group">

const resultsEl = document.getElementById('results');
const tableWrap = document.getElementById('tableWrap');
const resultHint = document.getElementById('resultHint');
const searchInput = document.getElementById('searchInput');
const toastEl = document.getElementById('toast');
const hudCount = document.getElementById('hudCount');

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1600);
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initial(name){ return (name||'?').trim().charAt(0); }

const activeFilters = {
  temple: '闇時2',
  acct: '1垢',
  number: '番号無し',
  senkou: '使用しない',
  onepunch: 'はい'
};
let filterEnabled = false;

function categoryMatch(note, group){
  const selected = activeFilters[group];
  switch(group){
    case 'temple':
      // 闇時2を選んだら全員条件クリア。その他を選ぶとなんでもOKの人のみ
      if(selected === '闇時2') return true;
      return note.includes('神殿:なんでもOK');
    case 'acct':
      // 複数垢を選んだら全員クリア。1垢を選ぶと「1垢でもOK」の人のみ
      if(selected === '複数垢') return true;
      return note.includes('垢:1垢でもOK');
    case 'number':
      // 777を選ぶとどちらでも該当。番号無しを選ぶと「番号無しでもOK」の人のみ(777のみは除外)
      if(selected === '777') return true;
      return note.includes('番号:番号無しでもOK');
    case 'senkou':
      // 使用しないを選ぶとどちらでも該当。使用するを選ぶとOKの人のみ(NGは除外)
      if(selected === '使用しない') return true;
      return note.includes('厳選キャラ:OK');
    case 'onepunch':
      // はいを選ぶとどちらでも該当。いいえを選ぶと「ワンパンキャラのみ」希望の人は除外
      if(selected === 'はい') return true;
      return !note.includes('ワンパンキャラのみ');
    default:
      return true;
  }
}

const DEFAULT_NOTE = '神殿:なんでもOK\n垢:1垢でもOK\n番号:番号無しでもOK\n厳選キャラ:OK\nワンパンキャラなくても大丈夫';

function matchesFilters(person){
  if(!filterEnabled) return true;
  const note = person.note || DEFAULT_NOTE;
  return Object.keys(activeFilters).every(group => categoryMatch(note, group));
}

function getFiltered(){
  const q = searchInput.value.trim().toLowerCase();
  let list = MEMBERS;
  if(q) list = list.filter(m => m.lineName.toLowerCase().includes(q));
  list = list.filter(matchesFilters);
  return list;
}

function renderTable(list){
  if(MEMBERS.length === 0){
    tableWrap.innerHTML = '<div class="table-empty">まだ登録がありません</div>';
    return;
  }
  if(list.length === 0){
    tableWrap.innerHTML = '<div class="table-empty">該当する人がいません</div>';
    return;
  }
  tableWrap.innerHTML = `
    <table class="ranks">
      <thead><tr><th>LINE名</th><th class="num">ランク</th></tr></thead>
      <tbody>
        ${list.map(p => `
          <tr>
            <td class="name">${escapeHtml(p.lineName)}</td>
            <td class="ranks-list">${p.accounts.map(a=>`<span class="r${a.closed?' closed-r':''}">${escapeHtml(a.rank)}</span>`).join('')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function render(){
  const list = getFiltered();
  renderTable(list);

  const q = searchInput.value.trim();
  const filtersActive = filterEnabled;

  if(MEMBERS.length === 0){
    resultsEl.innerHTML = '<div class="empty">まだ登録がありません。</div>';
    resultHint.textContent = '';
    return;
  }
  if(list.length === 0){
    const msg = q
      ? '「'+escapeHtml(q)+'」に一致するLINE名が見つかりません。'
      : '条件に一致するメンバーが見つかりません。';
    resultsEl.innerHTML = '<div class="empty">'+msg+'</div>';
    resultHint.textContent = '';
    return;
  }
  resultHint.textContent = (q || filtersActive) ? `${list.length}件ヒット` : `全${MEMBERS.length}件`;

function extractRankDiff(note){
  if(!note) return null;
  const m = note.match(/ランク差[:：]?\s*(\d+)\s*(?:差)?以上/);
  return m ? m[1] : null;
}

resultsEl.innerHTML = list.map((person, pi) => {
    const rankDiff = extractRankDiff(person.note);
    return `
    <div class="person" data-pidx="${pi}">
      <div class="person-head">
        <div class="avatar">${AVATARS[person.lineName] ? `<img src="${AVATARS[person.lineName]}" alt="">` : escapeHtml(initial(person.lineName))}</div>
        <div class="person-name-wrap" data-acct-toggle="${pi}">

          <div class="badge-row">
            <button class="memo-btn${person.note?' has-note':''}">募集条件${(person.note && person.note.includes('【追記】'))?'(追記あり)':''}</button>
          </div>
        </div>
      </div>
      <div class="memo-wrap"><div class="memo-inner">
        <div class="memo-body${person.note?'':' empty'}">${person.note ? escapeHtml(person.note) : 'メモは登録されていません。'}</div>
      </div></div>
      <div class="accounts-wrap"><div class="accounts-inner">
      <div class="accounts">
        ${person.accounts.map((a, ai) => `
          <div class="acct${a.closed?' closed':''}" data-idx="${pi}_${ai}" data-closed="${a.closed?'1':'0'}">
            <div class="acct-top">
              <div>
                <div class="acct-name">${escapeHtml(a.accountName)}</div>
                ${a.closed
                  ? `<div class="closed-badge">募集締切</div>`
                  : `<div class="tap-hint">タップしてID表示</div>`}
                ${a.rankStatus === 'updated'
                  ? `<div class="status-badge updated">ランク更新済み</div>`
                  : a.rankStatus === 'unknown'
                    ? `<div class="status-badge unknown">未確認(スクショなし)</div>`
                    : a.rankStatus === 'unsure'
                      ? `<div class="status-badge unsure">未確定</div>`
                      : ''}
              </div>
              <div class="rank-badge"><span class="rlabel">RANK</span><span class="rnum">${escapeHtml(a.rank)}</span></div>
            </div>
            ${a.closed ? '' : `
            <div class="acct-id-wrap"><div class="acct-id-inner">
              <div class="acct-id-row">
                <div class="acct-id">${escapeHtml(a.gameId)}</div>
                <button class="copy-btn" data-copy="${escapeHtml(a.gameId)}">コピー</button>
              </div>
            </div></div>
            `}
          </div>
        `).join('')}
      </div>
      </div></div>
    </div>
  `;
  }).join('');
}

resultsEl.addEventListener('click', async (e)=>{
  const badgesWrap = e.target.closest('.person-badges');
  if(badgesWrap){
    e.stopPropagation();
    const personEl = badgesWrap.closest('.person');
    personEl.classList.toggle('memo-open');
    return;
  }
  const nameWrap = e.target.closest('.person-name-wrap');
  if(nameWrap){
    e.stopPropagation();
    const personEl = nameWrap.closest('.person');
    personEl.classList.toggle('accounts-open');
    return;
  }
  const copyBtn = e.target.closest('.copy-btn');
  if(copyBtn){
    e.stopPropagation();
    const val = copyBtn.getAttribute('data-copy');
    try{
      await navigator.clipboard.writeText(val);
      copyBtn.textContent = '✓';
      copyBtn.classList.add('copied');
      toast('IDをコピーしました');
      setTimeout(()=>{ copyBtn.textContent='コピー'; copyBtn.classList.remove('copied'); }, 1200);
    }catch(err){
      toast('コピーに失敗しました');
    }
    return;
  }
  const acctEl = e.target.closest('.acct');
  if(acctEl && acctEl.getAttribute('data-closed') !== '1'){ acctEl.classList.toggle('open'); }
});

searchInput.addEventListener('input', render);

// ==== 条件フィルター(2択のラジオ式) ====
function applyRadioUI(group){
  const wrap = document.querySelector(`.filter-radio[data-filter-group="${group}"]`);
  wrap.querySelectorAll('.radio-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.value === activeFilters[group]);
  });
}

document.querySelectorAll('.filter-radio').forEach(wrap => {
  const group = wrap.dataset.filterGroup;
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.radio-btn');
    if(!btn) return;
    activeFilters[group] = btn.dataset.value;
    applyRadioUI(group);
    render();
  });
  applyRadioUI(group);
});

document.getElementById('filterReset').addEventListener('click', () => {
  activeFilters.temple = '闇時2';
  activeFilters.acct = '1垢';
  activeFilters.number = '番号無し';
  activeFilters.senkou = '使用しない';
  activeFilters.onepunch = 'はい';
  Object.keys(activeFilters).forEach(applyRadioUI);
  render();
});
